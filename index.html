<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma R1 Oftalmologia · Arthur 2026 · v43</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;--border:#252938;--border2:#2e3349;--text:#e8eaf2;--muted:#6b7080;--accent:#009933;--accent2:#007a28;--done-bg:#111722;--dia:#a3e4a3;--nuc:#5bc4d8;--D:#a78bfa;--A:#4ade80;--M:#fbbf24;--B:#f87171;--T:#fb923c;--S:#f472b6;--festa:#ffb347;--radius:10px;--radius-lg:18px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
  .header{background:linear-gradient(135deg,#0d0f14 0%,#161a2e 50%,#0d0f14 100%);border-bottom:1px solid var(--border);padding:32px 40px 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
  .header-inner{max-width:1100px;margin:0 auto}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .title-block h1{font-family:'DM Serif Display',serif;font-size:28px;letter-spacing:-.5px;color:#fff;line-height:1.2}
  .title-block h1 span{color:var(--accent);font-style:italic}
  .title-block p{color:var(--muted);font-size:12px;margin-top:4px;font-family:'DM Mono',monospace}
  .global-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;min-width:260px}
  .gp-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .gp-numbers{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
  .gp-n{font-size:26px;font-weight:600;color:#fff;font-family:'DM Mono',monospace}
  .gp-total{font-size:13px;color:var(--muted)}
  .gp-pct{font-size:13px;color:var(--accent);font-family:'DM Mono',monospace}
  .progress-bar{height:4px;background:var(--border2);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s ease}
  .stats-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .stat-chip strong{color:var(--text)}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot-D{background:var(--D)}.dot-A{background:var(--A)}.dot-M{background:var(--M)}.dot-B{background:var(--B)}.dot-rev{background:var(--nuc)}.dot-T{background:var(--T)}.dot-S{background:var(--S)}
  .filter-sep{color:var(--border2);font-size:18px}
  .filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s}
  .filter-btn:hover{border-color:var(--accent);color:var(--text)}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .main{max-width:1100px;margin:0 auto;padding:32px 40px 80px}
  .semana{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-bottom:20px;overflow:hidden;transition:border-color .2s;animation:fadeUp .35s ease both}
  .semana:nth-child(1){animation-delay:.02s}.semana:nth-child(2){animation-delay:.04s}.semana:nth-child(3){animation-delay:.06s}.semana:nth-child(4){animation-delay:.08s}.semana:nth-child(5){animation-delay:.10s}.semana:nth-child(6){animation-delay:.12s}.semana:nth-child(7){animation-delay:.14s}.semana:nth-child(8){animation-delay:.16s}
  .semana.all-done{border-color:#A8D4A8}
  .semana.current-week{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,153,51,.25)}
  .semana-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;cursor:pointer;user-select:none;gap:16px;flex-wrap:wrap}
  .semana-header:hover{background:var(--surface2)}
  .sem-left{display:flex;align-items:center;gap:14px}
  .sem-badge{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;font-family:'DM Mono',monospace;flex-shrink:0}
  .sem-title h3{font-size:15px;font-weight:600;color:#fff}
  .sem-title p{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px}
  .sem-right{display:flex;align-items:center;gap:16px}
  .sem-progress-wrap{display:flex;align-items:center;gap:8px}
  .sem-prog-bar{width:80px;height:3px;background:var(--border2);border-radius:99px;overflow:hidden}
  .sem-prog-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
  .sem-prog-pct{font-size:11px;color:var(--accent);font-family:'DM Mono',monospace;min-width:28px;text-align:right}
  .sem-aulas-done{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
  .sem-chevron{color:var(--muted);transition:transform .25s;font-size:16px}
  .semana.open .sem-chevron{transform:rotate(180deg)}
  .sem-aviso{background:#1e1a0e;border-top:1px solid #3a3010;padding:8px 24px;font-size:11px;color:#a89060;display:none}
  .semana.open .sem-aviso{display:block}
  .semana-body{display:none;padding:0 16px 16px}
  .semana.open .semana-body{display:block}
  .dia{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);margin-top:10px;overflow:hidden}
  .dia.plantao{border-color:#D4C8E8}
  .dia.noturno{border-color:#C8D8E8}
  .dia.pos-plantao{border-color:#E8D4D4}
  .dia.simulado-day{border-color:#E8D0E8}
  .dia.dia-done{border-color:#C8E0C8}
  .dia.festa{border-color:#E8D4A0;background:linear-gradient(135deg,#1a1208 0%,#0d0f14 100%)}
  .dia-header{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;cursor:pointer;gap:12px}
  .dia-header:hover{background:var(--surface2)}
  .dia.festa .dia-header:hover{background:rgba(255,179,71,.06)}
  .dia-left{display:flex;align-items:center;gap:10px}
  .dia-emoji{font-size:18px}
  .dia-info h4{font-size:13px;font-weight:600;color:var(--dia)}
  .dia.plantao .dia-info h4{color:#e87070}
  .dia.noturno .dia-info h4{color:#7ab8e0}
  .dia.pos-plantao .dia-info h4{color:#c8a080}
  .dia.simulado-day .dia-info h4{color:var(--S)}
  .dia.festa .dia-info h4{color:var(--festa);text-shadow:0 0 12px rgba(255,179,71,.3)}
  .dia-info p{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
  .dia.festa .dia-info p{color:#a07040}
  .dia-right{display:flex;align-items:center;gap:10px}
  .dia-count{font-size:11px;color:var(--muted)}
  .dia-chevron{color:var(--muted);transition:transform .2s;font-size:14px}
  .dia.open .dia-chevron{transform:rotate(180deg)}
  .dia-body{display:none;padding:4px 12px 12px}
  .dia.open .dia-body{display:block}
  .item{display:flex;align-items:flex-start;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .15s;margin-top:4px;border:1px solid transparent}
  .item:hover{background:var(--surface2)}
  .item.done{background:var(--done-bg);border-color:#1e2530}
  .item.done .item-name{text-decoration:line-through;color:var(--muted)}
  .item.done .item-meta{opacity:.5}
  .checkbox{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
  .item.done .checkbox{background:var(--accent);border-color:var(--accent)}
  .checkbox svg{display:none}.item.done .checkbox svg{display:block}
  .item-content{flex:1;min-width:0}
  .item-name{font-size:13px;color:var(--text);line-height:1.4}
  .item-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
  .prio-tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;font-family:'DM Mono',monospace;letter-spacing:.04em}
  .prio-D{background:#0f3320;color:var(--D)}.prio-A{background:#1a3322;color:var(--A)}.prio-M{background:#3a2a0e;color:var(--M)}.prio-N{background:#0e2a30;color:var(--nuc)}
  .item-time{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
  .item.revisao .checkbox{border-color:rgba(91,196,216,.4)}.item.revisao.done .checkbox{background:var(--nuc);border-color:var(--nuc)}.item.revisao .item-name{color:var(--nuc);font-weight:500}
  .item.treino{display:none!important}
  .item.treino_ .checkbox{border-color:rgba(251,146,60,.4)}.item.treino.done .checkbox{background:var(--T);border-color:var(--T)}.item.treino .item-name{color:var(--T);font-weight:500}
  .item.simulado .checkbox{border-color:rgba(244,114,182,.4)}.item.simulado.done .checkbox{background:var(--S);border-color:var(--S)}.item.simulado .item-name{color:var(--S);font-weight:600}
  .fab{position:fixed;bottom:28px;right:28px;background:var(--accent);border:none;border-radius:50px;padding:12px 20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;z-index:200;font-family:'Sora',sans-serif;box-shadow:0 4px 24px rgba(0,153,51,.6);display:flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
  .fab:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,153,51,.8)}
  @media(max-width:640px){.header{padding:20px 16px 16px}.main{padding:16px 12px 60px}.semana-header{padding:12px 16px}.header-top{flex-direction:column}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ── Mood Tracker ─────────────────────────────────────────────────────── */
  .tracker-fab{position:fixed;bottom:28px;left:28px;background:var(--surface);border:1.5px solid var(--border);border-radius:50px;padding:11px 18px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;z-index:200;font-family:'Sora',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;transition:all .15s}
  .tracker-fab:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tracker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
  .tracker-overlay.open{display:flex}
  .tracker-modal{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;width:100%;max-width:680px;padding:28px 28px 40px;display:flex;flex-direction:column;gap:20px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .tracker-header{display:flex;align-items:center;justify-content:space-between}
  .tracker-header h2{font-family:'DM Serif Display',serif;font-size:20px;color:#fff}
  .tracker-close{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);cursor:pointer;font-size:13px}
  .tracker-close:hover{border-color:var(--accent);color:var(--text)}
  .tracker-date-nav{display:flex;align-items:center;gap:10px;justify-content:center}
  .tracker-date-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:var(--text);cursor:pointer;font-size:13px;font-family:'Sora',sans-serif}
  .tracker-date-nav button:hover{border-color:var(--accent)}
  .tracker-date-label{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);min-width:120px;text-align:center}
  .tracker-section{display:flex;flex-direction:column;gap:10px}
  .tracker-section label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .mood-btn{background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;font-family:'Sora',sans-serif}
  .mood-btn:hover{border-color:var(--accent);background:rgba(0,153,51,.08)}
  .mood-btn.selected{border-color:var(--accent);background:rgba(0,153,51,.15)}
  .mood-btn .mood-emoji{font-size:24px;line-height:1}
  .mood-btn .mood-label{font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
  .mood-btn.selected .mood-label{color:var(--accent)}
  .symptom-grid{display:flex;flex-wrap:wrap;gap:8px}
  .sym-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif}
  .sym-btn:hover{border-color:#a78bfa;color:var(--text)}
  .sym-btn.selected{border-color:#a78bfa;background:rgba(167,139,250,.12);color:#a78bfa}
  .tracker-notes{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Sora',sans-serif;font-size:13px;line-height:1.6;resize:vertical;min-height:72px;outline:none}
  .tracker-notes:focus{border-color:var(--accent)}
  .tracker-notes::placeholder{color:var(--muted)}
  .tracker-energy{display:flex;gap:8px;align-items:center}
  .energy-bar{display:flex;gap:4px;flex:1}
  .energy-pip{flex:1;height:8px;border-radius:99px;background:var(--border);cursor:pointer;transition:background .15s}
  .energy-pip.active{background:var(--accent)}
  .med-section{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .med-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#a78bfa}
  .med-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .med-field{display:flex;flex-direction:column;gap:4px}
  .med-field label{font-size:11px;color:var(--muted)}
  .med-field input,.med-field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none}
  .med-field input:focus,.med-field select:focus{border-color:#a78bfa}
  .med-field select option{background:var(--surface)}
  .tracker-save{background:var(--accent);border:none;border-radius:12px;padding:13px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s}
  .tracker-save:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,153,51,.4)}
  .tracker-history{display:flex;flex-direction:column;gap:0}
  .hist-day{border-bottom:1px solid var(--border);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .hist-day:last-child{border-bottom:none}
  .hist-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:52px;padding-top:2px}
  .hist-mood-big{font-size:22px;line-height:1}
  .hist-body{flex:1;display:flex;flex-direction:column;gap:3px}
  .hist-chips{display:flex;flex-wrap:wrap;gap:4px}
  .hist-chip{font-size:10px;background:rgba(167,139,250,.12);color:#a78bfa;border-radius:99px;padding:2px 8px}
  .hist-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;line-height:1.4}
  .hist-energy-dots{display:flex;gap:2px;align-items:center}
  .hist-energy-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
  .hist-energy-dot.on{background:var(--accent)}
  .tab-bar{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
  .tab-btn{flex:1;padding:7px;border:none;background:none;border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px;font-family:'Sora',sans-serif;font-weight:500;transition:all .15s}
  .tab-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .chart-wrap{display:flex;flex-direction:column;gap:16px}
  .chart-row{display:flex;align-items:center;gap:8px}
  .chart-label{width:28px;text-align:center;font-size:14px}
  .chart-bar-bg{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden}
  .chart-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
  .chart-count{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;min-width:20px}
  .empty-state{text-align:center;padding:32px 0;color:var(--muted);font-size:13px}
  .streak-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,153,51,.1);border:1px solid rgba(0,153,51,.25);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--accent)}

  /* ── Auth overlay ──────────────────────────────────────────────────────── */
  #auth-overlay{position:fixed;inset:0;background:#0d0f14;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:18px}
  .auth-logo{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;text-align:center}.auth-logo span{color:var(--accent);font-style:italic}
  .auth-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:-10px}
  .auth-field{display:flex;flex-direction:column;gap:6px}
  .auth-field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .auth-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:'Sora',sans-serif;outline:none;width:100%}
  .auth-input:focus{border-color:var(--accent)}
  .auth-btn{background:var(--accent);border:none;border-radius:10px;padding:13px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;transition:all .15s;width:100%}
  .auth-btn:hover{background:#007a28}
  .auth-btn:disabled{opacity:.5;cursor:not-allowed}
  .auth-msg{font-size:12px;text-align:center;color:var(--muted);min-height:16px}
  .auth-msg.err{color:#f87171}.auth-msg.ok{color:var(--accent)}
  #sync-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:999;transform:scaleX(0);transform-origin:left;transition:transform .4s;display:none}
  #sync-status{position:fixed;top:8px;right:16px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px 10px;display:none}
  #user-chip{position:fixed;top:8px;right:16px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px 10px;cursor:pointer;display:none}
  #user-chip:hover{border-color:var(--accent)}

</style>
</head>
<body>

<div id="sync-bar"></div>
<div id="sync-status"></div>
<div id="user-chip" onclick="signOut()" title="Clique para sair">👤 <span id="user-email-chip"></span> · Sair</div>

<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">Cronograma <span>R1 Oftalmologia</span></div>
    <div class="auth-sub">Arthur · Extensivo 2026 · acesso sincronizado</div>
    <div class="auth-field">
      <label>E-mail</label>
      <input class="auth-input" id="auth-email" type="email" placeholder="seu@email.com" autocomplete="email"/>
    </div>
    <div class="auth-field">
      <label>Senha</label>
      <input class="auth-input" id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doSignIn()"/>
    </div>
    <button class="auth-btn" id="auth-btn" onclick="doSignIn()">Entrar</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="title-block">
        <h1>Cronograma <span>R1 Oftalmologia</span></h1>
        <p>Arthur · Extensivo 2026 · 23/02 → 23/09/2026</p>
      </div>
      <div class="global-progress">
        <div class="gp-label">Progresso Total</div>
        <div class="gp-numbers">

function getDiaExtra(dia){
  if(dia.evento){
    if(dia.plantao)return['plantao festa','🏥 '+dia.evento];
    const hasSim=dia.items&&dia.items.some(i=>i.tipo==='simulado');
    return['festa','🎉 '+dia.evento+(hasSim?' · Simulado':'')+(dia.tempo&&!hasSim?' · '+dia.tempo:'')];
  }
  if(dia.plantao&&dia.nome==='QUARTA')return['plantao','🏥 Plantão noturno (término)'];
  if(dia.plantao)return['plantao','🏥 Plantão 24h'];
  if(dia.restrito&&dia.nome==='QUARTA')return['pos-plantao','😴 Recuperação pós-plantão noturno · só Revisão 5q'];
  const hasSim=dia.items&&dia.items.some(i=>i.tipo==='simulado');
  if(hasSim)return['simulado-day','📝 Simulado · 4h'];
  return['',dia.tempo?'⏱ '+dia.tempo:''];
}

// ============================================================
// AUTO-REDISTRIBUIÇÃO DE AULAS ATRASADAS
// Roda automaticamente toda segunda-feira ou ao clicar no botão
// ============================================================
const TIPO_A_WEEKS = [1,3,5,7]; // Semanas 9+ passaram para plantão noturno semanal (Tipo B)

function getDayMax(semNum, diaNome) {
  return (diaNome === 'QUARTA' && TIPO_A_WEEKS.includes(semNum)) ? 2 : 4;
}
function getAulasCount(dia) {
  return dia.items.filter(i => i.tipo === 'aula').length;
}
function canReceive(semNum, dia) {
  if (dia.plantao || dia.restrito) return false;
  if (dia.items.some(i => i.tipo === 'simulado')) return false;
  if (dia.evento && getAulasCount(dia) === 0) return false;
  return getAulasCount(dia) < getDayMax(semNum, dia.nome);
}


function runAutoRedistr(silent) {
  const curWeek = todayWeek();
  const moved = [];

  // Collect pending aulas from past weeks AND remap state keys
  for (let sn = 1; sn < curWeek; sn++) {
    const sem = CRONOGRAMA[sn - 1];
    sem.dias.forEach((dia, di) => {
      const toKeep = [];
      const oldIndexMap = []; // maps newIndex → oldIndex for kept items

      dia.items.forEach((item, ii) => {
        const key = makeId(sem.num, di, ii);
        if (item.tipo === 'aula' && !state[key]) {
          // Pending aula → move it out
          moved.push({
            item: JSON.parse(JSON.stringify(item)),
            de: `Sem${sn} ${dia.nome} ${dia.data}`
          });
        } else {
          // Keep this item; track old index → new index mapping
          oldIndexMap.push(ii);
          toKeep.push(item);
        }
      });

      // Remap state keys for items that shifted position
      oldIndexMap.forEach((oldIi, newIi) => {
        if (oldIi !== newIi) {
          const oldKey = makeId(sem.num, di, oldIi);
          const newKey = makeId(sem.num, di, newIi);
          if (state[oldKey] !== undefined) {
            state[newKey] = state[oldKey];
            delete state[oldKey];
          }
        }
      });

      dia.items = toKeep;
    });
  }

  if (moved.length === 0) {
      saveState(state);
      saveCrono();
    render();
    return moved;
  }

  // Place each pending aula in earliest available slot from curWeek onwards
  for (const p of moved) {
    let best = null, bestScore = 99999;
    for (let sn = curWeek; sn <= 23; sn++) {
      const sem = CRONOGRAMA[sn - 1];
      sem.dias.forEach((dia) => {
        if (!canReceive(sn, dia)) return;
        const cur = getAulasCount(dia);
        const score = (sn - curWeek) * 8 + cur * 3;
        if (score < bestScore) { bestScore = score; best = { sn, dia }; }
      });
    }
    if (best) {
      best.dia.items.push(p.item);
      p.para = `Sem${best.sn} ${best.dia.nome} ${best.dia.data}`;
    }
  }

  saveState(state);
  saveCrono();
  render();
  if (!silent) showToastRedistr(moved);
  return moved;
}

  }

  const toast = document.createElement('div');
  toast.id = 'toast-redistr';
  toast.style.cssText = [
    'position:fixed','bottom:76px','left:50%','transform:translateX(-50%)',

const MOOD_EMOJIS={1:'😔',2:'😕',3:'😐',4:'🙂',5:'😄'};
const SYM_LABELS={ansiedade:'Ansiedade',irritabilidade:'Irritabilidade',insonia:'Insônia',sonolencia:'Sonolência',focado:'Focado',disperso:'Disperso',cefaleia:'Cefaleia',nausea:'Náusea',apetite_red:'↓ Apetite',apetite_aum:'↑ Apetite',palpitacao:'Palpitação',boca_seca:'Boca seca',motivado:'Motivado',desmotivado:'Desmotivado',choro:'Choro fácil',libido:'↓ Libido'};
function renderHistorico(){
  loadMoodData();
  const keys=Object.keys(moodData).sort().reverse().slice(0,60);
  const el=document.getElementById('hist-content');
  if(!keys.length){el.innerHTML='<div class="empty-state">Nenhum registro ainda.<br>Comece registrando hoje! 💊</div>';return;}

  for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);if(moodData[dateKey(d)])streak++;else break;}
  el.innerHTML=(streak>1?`<div style="margin-bottom:12px"><span class="streak-chip">🔥 ${streak} dias seguidos</span></div>`:'')
    +keys.map(key=>{
      const e=moodData[key],d=new Date(key+'T12:00:00');
      const dots=Array.from({length:10},(_,i)=>`<div class="hist-energy-dot${e.energy&&i<e.energy?' on':''}"></div>`).join('');
      const chips=e.syms&&e.syms.length?e.syms.map(s=>`<span class="hist-chip">${SYM_LABELS[s]||s}</span>`).join(''):'';
      const medInfo=e.med&&e.med.nome?`<span class="hist-chip" style="background:rgba(167,139,250,.2)">💊 ${e.med.nome}${e.med.dose?' '+e.med.dose:''}</span>`:'';
      return`<div class="hist-day"><div class="hist-date">${fmtDate(d)}</div><div class="hist-mood-big">${e.mood?MOOD_EMOJIS[e.mood]:'—'}</div><div class="hist-body"><div style="display:flex;align-items:center;gap:8px"><div class="hist-energy-dots">${dots}</div>${e.sleep?`<span style="font-size:11px;color:var(--muted)">Sono ${MOOD_EMOJIS[e.sleep]}</span>`:''}</div>${chips||medInfo?`<div class="hist-chips">${chips}${medInfo}</div>`:''} ${e.notes?`<div class="hist-note">"${e.notes}"</div>`:''}</div></div>`;
    }).join('');
}
function renderGrafico(){
  loadMoodData();
  const keys=Object.keys(moodData).sort().reverse().slice(0,30);
  const el=document.getElementById('chart-content');
  if(!keys.length){el.innerHTML='<div class="empty-state">Sem dados para exibir.</div>';return;}
  const freq=[0,0,0,0,0];
  keys.forEach(k=>{const m=moodData[k].mood;if(m)freq[m-1]++;});
  const maxF=Math.max(...freq,1);
  const moodRows=[1,2,3,4,5].map(m=>`<div class="chart-row"><div class="chart-label">${MOOD_EMOJIS[m]}</div><div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${Math.round(freq[m-1]/maxF*100)}%"></div></div><div class="chart-count">${freq[m-1]}d</div></div>`).join('');
  const last14=Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return{key:dateKey(d),d,e:moodData[dateKey(d)]};});
  const spark=last14.map(({d,e})=>{const h=e&&e.energy?Math.round(e.energy/10*36):0;const col=e&&e.mood?['#e87070','#fb923c','#fbbf24','#4ade80','#009933'][e.mood-1]:'var(--border)';return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1"><div style="width:100%;height:${h}px;background:${col};border-radius:3px 3px 0 0;min-height:2px"></div><div style="font-size:8px;color:var(--muted)">${d.getDate()}</div></div>`;}).join('');
  const medDays=keys.filter(k=>moodData[k].med&&moodData[k].med.tomou==='sim').length;
  el.innerHTML=`<div class="tracker-section"><label>Humor — frequência (${keys.length} dias)</label>${moodRows}</div><div class="tracker-section"><label>Energia · últimos 14 dias (cor = humor)</label><div style="display:flex;align-items:flex-end;gap:2px;height:44px;padding-top:4px">${spark}</div></div><div class="tracker-section"><label>Adesão à medicação</label><div style="display:flex;align-items:center;gap:12px"><div style="font-size:28px;font-weight:700;color:var(--accent)">${keys.length?Math.round(medDays/keys.length*100):0}%</div><div style="font-size:12px;color:var(--muted)">${medDays} de ${keys.length} dias com medicação tomada</div></div></div>`;
}

const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtcm1xaGNhaWFraGR6bnlobXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3ODUzMTIsImV4cCI6MjA5NTM2MTMxMn0.Yn3qb5mOUcZ5uNVSZ2jM_XqWS4KJa3EVvZGFvADKswE'; // ← substitua pela sua anon key

// ── Auth ─────────────────────────────────────────────────────────────────────
async function initAuth() {
  const { data: { session } } = await supa.auth.getSession();
  if (session) {
    await onSignedIn(session.user);
  }
  supa.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN') await onSignedIn(session.user);
    if (event === 'SIGNED_OUT') onSignedOut();
  });
}

async function onSignedIn(user) {
  currentUser = user;
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('user-chip').style.display = 'block';
  document.getElementById('user-email-chip').textContent = user.email.split('@')[0];

  render();
  updateGlobalStats();
}

function onSignedOut() {
  currentUser = null;
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('user-chip').style.display = 'none';
}

async function doSignIn() {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const btn   = document.getElementById('auth-btn');
  const msg   = document.getElementById('auth-msg');
  if (!email || !pass) { msg.textContent = 'Preencha e-mail e senha.'; msg.className = 'auth-msg err'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
  const { error } = await supa.auth.signInWithPassword({ email, password: pass });
  if (error) {
    // Try sign-up if user doesn't exist (first access)
    if (error.message.includes('Invalid login')) {
      const { error: e2 } = await supa.auth.signUp({ email, password: pass });
      if (e2) { msg.textContent = e2.message; msg.className = 'auth-msg err'; }
      else { msg.textContent = 'Conta criada! Verifique seu e-mail para confirmar.'; msg.className = 'auth-msg ok'; }
    } else {
      msg.textContent = error.message; msg.className = 'auth-msg err';
    }
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}

async function signOut() {
  await supa.auth.signOut();
}

// ── Sync helpers ─────────────────────────────────────────────────────────────
function showSync(msg) {
  const el = document.getElementById('sync-status');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(showSync._t);
  showSync._t = setTimeout(() => el.style.display = 'none', 2500);
}

async function syncDown() {
  if (!currentUser) return;
  try {
    // 1. Pull aula progress (check state)
    const { data: progData } = await supa.from('cronograma_progress')
      .select('state_json, updated_at')
      .eq('user_id', currentUser.id)
      .single();
    if (progData?.state_json) {
      const remote = JSON.parse(progData.state_json);
      // Merge: remote wins (it's the canonical cloud state)
      state = remote;
      saveState(state);
    }

    // 2. Pull mood tracker
    const { data: moodRows } = await supa.from('cronograma_mood')
      .select('date_key, entry_json')
      .eq('user_id', currentUser.id);
    if (moodRows && moodRows.length > 0) {
      moodData = {};
      moodRows.forEach(r => { moodData[r.date_key] = JSON.parse(r.entry_json); });
      saveMoodData();
    }
    showSync('☁️ Sincronizado');
  } catch(e) { console.warn('syncDown error', e); }
}

async function syncUp() {
  if (!currentUser || isSyncing) return;
  isSyncing = true;
  // Show sync bar animation
  const bar = document.getElementById('sync-bar');
  bar.style.display = 'block'; bar.style.transform = 'scaleX(0.7)';

  try {
    await supa.from('cronograma_progress').upsert({
      user_id: currentUser.id,
      state_json: JSON.stringify(state),
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    bar.style.transform = 'scaleX(1)';
    setTimeout(() => { bar.style.display = 'none'; bar.style.transform = 'scaleX(0)'; }, 400);
    showSync('✓ Salvo na nuvem');
  } catch(e) { console.warn('syncUp error', e); showSync('⚠ Sem conexão'); }
  isSyncing = false;
}

async function syncMoodUp(key, entry) {
  if (!currentUser) return;
  try {
    await supa.from('cronograma_mood').upsert({
      user_id: currentUser.id,
      date_key: key,
      entry_json: JSON.stringify(entry),
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,date_key' });
    showSync('💊 Humor salvo na nuvem');
  } catch(e) { console.warn('syncMoodUp error', e); }
}

// ── Override saveState to also sync up ───────────────────────────────────────
const _origSaveState = saveState;
function saveState(s) {
  _origSaveState(s);
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(() => syncUp(), 1200); // debounce 1.2s
}

// ── Override saveEntry (mood tracker) to also sync up ────────────────────────
const _origSaveMoodData = saveMoodData;
function saveMoodData() {
  _origSaveMoodData();
}

initAuth();
render();
</script>

          <button class="sym-btn" data-sym="desmotivado" onclick="toggleSym(this)">😶 Desmotivado</button>
          <button class="sym-btn" data-sym="choro" onclick="toggleSym(this)">😢 Choro fácil</button>
          <button class="sym-btn" data-sym="libido" onclick="toggleSym(this)">❤️ ↓ Libido</button>
        </div>
      </div>
      <div class="tracker-section">
        <label>Qualidade do sono (noite anterior)</label>
        <div class="mood-grid">
          <button class="mood-btn" data-sleep="1" onclick="selectSleep(1)"><span class="mood-emoji">😫</span><span class="mood-label">Péssimo</span></button>
          <button class="mood-btn" data-sleep="2" onclick="selectSleep(2)"><span class="mood-emoji">😕</span><span class="mood-label">Ruim</span></button>
          <button class="mood-btn" data-sleep="3" onclick="selectSleep(3)"><span class="mood-emoji">😐</span><span class="mood-label">Regular</span></button>
          <button class="mood-btn" data-sleep="4" onclick="selectSleep(4)"><span class="mood-emoji">😌</span><span class="mood-label">Bom</span></button>
          <button class="mood-btn" data-sleep="5" onclick="selectSleep(5)"><span class="mood-emoji">😴</span><span class="mood-label">Ótimo</span></button>
        </div>
      </div>
      <div class="med-section">
        <div class="med-header">💊 Medicação do dia</div>
        <div class="med-fields">
          <div class="med-field"><label>Medicamento</label><input type="text" id="med-nome" placeholder="Ex: Atomoxetina"/></div>
          <div class="med-field"><label>Dose</label><input type="text" id="med-dose" placeholder="Ex: 40mg"/></div>
          <div class="med-field"><label>Tomou?</label>
            <select id="med-tomou"><option value="">—</option><option value="sim">✓ Sim</option><option value="nao">✗ Não</option><option value="parcial">◑ Parcial</option></select>
          </div>
          <div class="med-field"><label>Dias em uso</label><input type="number" id="med-dias" placeholder="0" min="0"/></div>
        </div>
      </div>
      <div class="tracker-section">
        <label>Notas livres</label>
        <textarea class="tracker-notes" id="tracker-notes" placeholder="Como foi o dia? Algo diferente que notou?"></textarea>
      </div>
      <button class="tracker-save" onclick="saveEntry()">💾 Salvar registro</button>
    </div>
    <div id="tab-historico" style="display:none"><div id="hist-content" class="tracker-history"></div></div>
    <div id="tab-grafico" style="display:none"><div class="chart-wrap" id="chart-content"></div></div>
  </div>
</div>
</body>
</html>
